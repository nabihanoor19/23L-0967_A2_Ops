<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}VisionGuard{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <div class="wrap">
      <a class="brand" href="{{ url_for('index') }}">VisionGuard</a>
      <nav>
        <a href="{{ url_for('index') }}">Check an image</a>
        <a href="{{ url_for('history') }}">History</a>
      </nav>
    </div>
  </header>
  <main class="wrap">{% block content %}{% endblock %}</main>
  <footer class="wrap small">VisionGuard is a student prototype. Its verdicts are estimates, not proof.</footer>
</body>
</html>
