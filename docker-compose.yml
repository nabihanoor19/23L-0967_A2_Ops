name: 23l-0967_a2_ops

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # no "ports:" section on purpose: only services on the Compose network can reach the database

  web:
    build: .
    image: visionguard:v1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MODEL_PATH: /app/models/champion.keras
      MODEL_META_PATH: /app/models/champion_meta.json
      PREDICTOR_URL: ${PREDICTOR_URL:-}
      PREDICTOR_API_KEY: ${PREDICTOR_API_KEY:-}
    volumes:
      - ./models:/app/models:ro
    ports:
      - "${WEB_PORT:-5000}:5000"

volumes:
  pgdata:
