name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-ci.txt
      - name: Lint
        run: ruff check app.py src tests
      - name: Tests
        run: python -m pytest -v

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image
        run: docker build -t visionguard:ci .
      - name: Check the image
        run: docker run --rm visionguard:ci python -c "import tensorflow as tf, flask; print('TensorFlow', tf.__version__)"